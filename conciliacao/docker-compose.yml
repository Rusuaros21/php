# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conciliacao}
      POSTGRES_USER: ${POSTGRES_USER:-conciliacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conciliacao}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

volumes:
  dados_postgres:
